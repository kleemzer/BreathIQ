<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fond plein bord-à-bord (requis maskable) -->
  <rect width="100" height="100" fill="#1A3C5E"/>
  <!-- Contenu dans la zone de sécurité 60% : de 20 à 80 (marges 20%) -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#2A7FD4" stroke-width="3" opacity="0.4"/>
  <circle cx="50" cy="50" r="20" fill="none" stroke="#0E8C7A" stroke-width="3" opacity="0.7"/>
  <circle cx="50" cy="50" r="10" fill="#0E8C7A"/>
</svg>
