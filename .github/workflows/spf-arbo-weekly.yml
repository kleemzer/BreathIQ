name: SPF Arboviroses Weekly

# Bulletin national SPF (chikungunya, dengue, Zika, West Nile) — publié chaque semaine de mai à novembre.
on:
  schedule:
    - cron: '0 18 * * 3'
    - cron: '0 8 * * 4'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Installer pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Collecte → data/spf-arbo.json
        run: node scripts/spf-arbo-fetch.mjs
      - name: Validation des données
        run: node scripts/validate-data.mjs
      - name: Commit si changement
        if: always()
        run: |
          git config user.name "SPF-Arbo-Bot"
          git config user.email "bot@breathiq.fr"
          git add data/spf-arbo.json
          if git diff --staged --quiet; then
            echo "Aucune modification"
          else
            WEEK=$(node -e "console.log(require('./data/spf-arbo.json').epiWeek || '')")
            git commit -m "data: SPF arboviroses ${WEEK} ($(date +%Y-%m-%d))"
            git pull --rebase origin main || true
            git push origin main || { echo "Push échoué — retenté au prochain run"; exit 0; }
          fi
